<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0d1f">
<meta name="description" content="Sky-Stack — a touch-first tower-stacking game. Time the drop and build the tallest tower you can.">
<title>Sky-Stack · Tower Stacking Game</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='8' y='44' width='48' height='12' rx='3' fill='%235c8bff'/%3E%3Crect x='14' y='32' width='36' height='12' rx='3' fill='%2385b3ff'/%3E%3Crect x='20' y='20' width='24' height='12' rx='3' fill='%23b5d4ff'/%3E%3Crect x='26' y='8' width='12' height='12' rx='3' fill='%23ffffff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <canvas id="game"></canvas>

    <div id="hud">
      <div id="score-wrap">
        <div id="score">0</div>
        <div id="score-label">HEIGHT</div>
      </div>
      <div id="best-wrap">
        <div id="best-label">BEST</div>
        <div id="best">0</div>
      </div>
      <button id="mute" type="button" aria-label="Toggle sound">&#x1F50A;</button>
    </div>

    <div id="combo" class="hidden"></div>

    <div id="overlay-start" class="overlay">
      <div class="card">
        <h1>SKY&#8209;STACK</h1>
        <p class="tagline">How high can you stack?</p>
        <p class="hint">Tap, click, or press <kbd>Space</kbd> to drop the platform.</p>
        <ul class="rules">
          <li><span>Flush landings</span> build the tower</li>
          <li><span>Perfect stacks</span> give bonus width &amp; combos</li>
          <li><span>Any miss</span> ends the run</li>
        </ul>
        <button id="btn-start" type="button">PLAY</button>
      </div>
    </div>

    <div id="overlay-gameover" class="overlay hidden">
      <div class="card">
        <h2>TOWER FELL</h2>
        <div id="final-label">Height reached</div>
        <div id="final-height">0</div>
        <div id="new-best" class="hidden">&#9733; NEW BEST &#9733;</div>
        <button id="btn-restart" type="button">STACK AGAIN</button>
        <p class="hint">or press <kbd>Space</kbd></p>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
