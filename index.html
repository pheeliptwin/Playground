<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b0d1f">
<title>Playground · Browser Apps</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='8' y='44' width='48' height='12' rx='3' fill='%235c8bff'/%3E%3Crect x='14' y='32' width='36' height='12' rx='3' fill='%2385b3ff'/%3E%3Crect x='20' y='20' width='24' height='12' rx='3' fill='%23b5d4ff'/%3E%3Crect x='26' y='8' width='12' height='12' rx='3' fill='%23ffffff'/%3E%3C/svg%3E">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    font-family: "Avenir Next", "Segoe UI", system-ui, -apple-system, sans-serif;
    color: #fff;
    background: radial-gradient(130% 110% at 50% 0%, #1a1e3e 0%, #0b0d1f 55%, #07081a 100%);
    -webkit-font-smoothing: antialiased;
  }
  header {
    padding: 56px 24px 16px;
    text-align: center;
  }
  header h1 {
    font-size: clamp(40px, 7vw, 60px);
    font-weight: 900;
    letter-spacing: 0.08em;
    background: linear-gradient(180deg, #fff 25%, #8fb6ff 95%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  header p {
    margin-top: 8px;
    color: rgba(255, 255, 255, 0.6);
    font-size: 15px;
  }
  main {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 22px;
    max-width: 960px;
    margin: 32px auto 64px;
    padding: 0 24px;
  }
  .card {
    position: relative;
    display: block;
    border-radius: 18px;
    overflow: hidden;
    background: linear-gradient(165deg, rgba(40, 46, 92, 0.9), rgba(18, 21, 48, 0.95));
    border: 1px solid rgba(255, 255, 255, 0.1);
    box-shadow: 0 14px 34px rgba(0, 0, 0, 0.35);
    text-decoration: none;
    color: inherit;
    transition: transform 0.16s ease, box-shadow 0.16s ease;
  }
  .card:hover { transform: translateY(-4px); box-shadow: 0 22px 44px rgba(0, 0, 0, 0.45); }
  .thumb {
    height: 150px;
    background:
      radial-gradient(90% 130% at 20% 10%, rgba(255, 215, 106, 0.35), transparent 55%),
      linear-gradient(180deg, #4aa3ee 0%, #b9e6ff 40%, #ffd76a 100%);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding-bottom: 22px;
  }
  .thumb .stack {
    display: flex;
    flex-direction: column-reverse;
    align-items: center;
    gap: 3px;
  }
  .thumb .stack span {
    display: block;
    height: 14px;
    border-radius: 3px;
    opacity: 0.95;
  }
  .meta { padding: 16px 18px 18px; }
  .meta h2 { font-size: 20px; font-weight: 800; letter-spacing: 0.04em; }
  .meta p { margin-top: 4px; font-size: 13px; color: rgba(255, 255, 255, 0.62); }
  .meta .tag {
    display: inline-block;
    margin-top: 10px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.18em;
    color: #ffd76a;
  }
</style>
</head>
<body>
  <header>
    <h1>PLAYGROUND</h1>
    <p>Small, polished browser games.</p>
  </header>

  <main>
    <a class="card" href="sky-stack/index.html">
      <div class="thumb">
        <div class="stack">
          <span style="width:52px;background:#4f4fbf"></span>
          <span style="width:70px;background:#5c8bff"></span>
          <span style="width:88px;background:#85b3ff"></span>
          <span style="width:104px;background:#b5d4ff"></span>
          <span style="width:120px;background:#ffe9a8"></span>
        </div>
      </div>
      <div class="meta">
        <h2>Sky-Stack</h2>
        <p>Time the drop and build the tallest tower you can.</p>
        <span class="tag">TOWER STACKING</span>
      </div>
    </a>
  </main>
</body>
</html>
